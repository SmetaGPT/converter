name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: publish-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Resolve release version
        id: release_meta
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if (-not $tag.StartsWith('v')) { throw "Expected v-prefixed tag, got $tag" }
          $version = $tag.Substring(1)
          $releaseDir = Join-Path 'dist\release' ("DocumentConverter-" + $version)
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_dir=$releaseDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check dependency graph
        shell: pwsh
        run: |
          python -m pip check

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -v

      - name: Build Windows package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Name DocumentConverter

      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\smoke-test-windows-exe.ps1 -ExePath dist\DocumentConverter\DocumentConverter.exe

      - name: Package portable release
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\package-release.ps1 -Name DocumentConverter -Version '${{ steps.release_meta.outputs.version }}' -SkipBuild
          $releaseDir = '${{ steps.release_meta.outputs.release_dir }}'
          $zipPath = Join-Path $releaseDir ("DocumentConverter-" + '${{ steps.release_meta.outputs.version }}' + "-windows-portable.zip")
          $checksumPath = Join-Path $releaseDir ("DocumentConverter-" + '${{ steps.release_meta.outputs.version }}' + "-windows-portable.sha256.txt")
          $notesPath = Join-Path $releaseDir 'release-notes.md'
          if (-not (Test-Path $zipPath)) { throw "Portable zip missing: $zipPath" }
          if (-not (Test-Path $checksumPath)) { throw "Checksum missing: $checksumPath" }
          if (-not (Test-Path $notesPath)) { throw "Release notes missing: $notesPath" }

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: document-converter-release-bundle-${{ steps.release_meta.outputs.version }}
          path: ${{ steps.release_meta.outputs.release_dir }}

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ steps.release_meta.outputs.version }}'
          $releaseDir = '${{ steps.release_meta.outputs.release_dir }}'
          $zipPath = Join-Path $releaseDir ("DocumentConverter-" + $version + "-windows-portable.zip")
          $checksumPath = Join-Path $releaseDir ("DocumentConverter-" + $version + "-windows-portable.sha256.txt")
          $notesPath = Join-Path $releaseDir 'release-notes.md'
          $title = "Windows Document Converter $tag"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $zipPath $checksumPath --clobber
              gh release edit $tag --title $title --notes-file $notesPath
          }
          else {
              gh release create $tag $zipPath $checksumPath --title $title --notes-file $notesPath
          }
