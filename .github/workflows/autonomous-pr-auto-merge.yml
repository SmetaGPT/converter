name: autonomous-pr-auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: ci-auto-merge
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'agent:autonomous')
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge for autonomous PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash --delete-branch "$PR_URL"
          if [ $? -ne 0 ]; then
            echo "::warning::Auto-merge was not enabled. Confirm repository auto-merge and branch-protection settings for main."
            exit 0
          fi