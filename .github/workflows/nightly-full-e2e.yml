name: nightly-full-e2e

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-e2e
  cancel-in-progress: false

env:
  NIGHTLY_VERSION: 0.3.0-nightly
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  nightly-full-e2e:
    name: nightly-full-e2e
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Check dependency graph
        shell: pwsh
        run: |
          python -m pip check

      - name: Run synthetic e2e and validate packages
        id: synthetic
        shell: pwsh
        run: |
          python scripts\run_synthetic_e2e.py --clean
          $runDir = Get-ChildItem runs\synthetic-e2e-output\runs -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $runDir) { throw 'Synthetic run dir missing' }
          python scripts\validate_run_package.py $runDir
          python scripts\validate_document_package.py $runDir
          "run_dir=$runDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run full formula benchmark monitor
        id: formula_full
        shell: pwsh
        run: |
          python scripts\run_formula_benchmark.py samples\formula-benchmark.manifest.jsonl --no-thresholds --output-root runs\formula-benchmark-nightly-full
          $runDir = Get-ChildItem runs\formula-benchmark-nightly-full\runs -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $runDir) { throw 'Nightly full formula benchmark run dir missing' }
          "run_dir=$runDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run formula benchmark CI-safe gate
        id: formula_gate
        shell: pwsh
        run: |
          python scripts\run_formula_benchmark.py samples\formula-benchmark.ci.manifest.jsonl --thresholds samples\formula-benchmark.ci.thresholds.json --output-root runs\formula-benchmark-nightly-gate
          $runDir = Get-ChildItem runs\formula-benchmark-nightly-gate\runs -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $runDir) { throw 'Nightly formula gate run dir missing' }
          "run_dir=$runDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check table anchor source availability
        id: table_anchor_sources
        shell: pwsh
        run: |
          $manifestPath = (Resolve-Path 'samples\manifest.table-anchors.ci.jsonl').Path
          $manifestDir = Split-Path -Parent $manifestPath
          $preflightDir = Join-Path 'runs\nightly-table-anchors' 'source-preflight'
          New-Item -ItemType Directory -Force -Path $preflightDir | Out-Null

          $missing = @()
          Get-Content -Path $manifestPath -Encoding utf8 | Where-Object { $_.Trim() } | ForEach-Object {
            $record = $_ | ConvertFrom-Json
            $sourceRoot = [string]$record.source_root
            if (-not [System.IO.Path]::IsPathRooted($sourceRoot)) {
              $sourceRoot = [System.IO.Path]::GetFullPath((Join-Path $manifestDir $sourceRoot))
            }

            $relativePath = [string]$record.relative_path
            if ([System.IO.Path]::IsPathRooted($relativePath)) {
              $sourcePath = [System.IO.Path]::GetFullPath($relativePath)
            } else {
              $sourcePath = [System.IO.Path]::GetFullPath((Join-Path $sourceRoot $relativePath))
            }

            if (-not (Test-Path -LiteralPath $sourcePath)) {
              $missing += $sourcePath
            }
          }

          $available = $missing.Count -eq 0
          $payload = [ordered]@{
            status = if ($available) { 'ok' } else { 'skipped_missing_input' }
            manifest = $manifestPath
            missing_sources = $missing
          }
          $payload | ConvertTo-Json -Depth 4 | Out-File -FilePath (Join-Path $preflightDir 'table-anchor-source-preflight.json') -Encoding utf8
          "available=$($available.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "preflight_dir=$((Resolve-Path $preflightDir).Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if (-not $available) {
            Write-Warning "Skipping table anchors nightly contour because $($missing.Count) source file(s) are unavailable on this runner."
          }

      - name: Run table anchors nightly contour
        if: ${{ steps.table_anchor_sources.outputs.available == 'true' }}
        id: table_anchors
        shell: pwsh
        run: |
          python scripts\run_sample_pilot.py --manifest samples\manifest.table-anchors.ci.jsonl --output runs\nightly-table-anchors --input runs\nightly-table-anchors-input --clean
          $runDir = Get-ChildItem runs\nightly-table-anchors\runs -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $runDir) { throw 'Nightly table anchor run dir missing' }
          python scripts\validate_sample_expectations.py $runDir --manifest samples\manifest.table-anchors.ci.jsonl --expected-dir samples\expected --sample-id sample_009 --sample-id sample_018 --sample-id sample_020
          "run_dir=$runDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run OCR preflight schema check
        shell: pwsh
        run: |
          python scripts\validate_ocr_preflight_cli.py

      - name: Build Windows package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Name DocumentConverter

      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\smoke-test-windows-exe.ps1 -ExePath dist\DocumentConverter\DocumentConverter.exe

      - name: Package portable nightly build
        id: package_release
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\package-release.ps1 -Name DocumentConverter -Version $env:NIGHTLY_VERSION -SkipBuild
          $releaseDir = Resolve-Path (Join-Path 'dist\release' ("DocumentConverter-" + $env:NIGHTLY_VERSION))
          if (-not (Test-Path (Join-Path $releaseDir "DocumentConverter-$env:NIGHTLY_VERSION-windows-portable.zip"))) { throw 'Portable zip missing' }
          if (-not (Test-Path (Join-Path $releaseDir "DocumentConverter-$env:NIGHTLY_VERSION-windows-portable.sha256.txt"))) { throw 'Checksum missing' }
          if (-not (Test-Path (Join-Path $releaseDir 'release-notes.md'))) { throw 'Release notes missing' }
          "release_dir=$releaseDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload nightly artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-full-e2e-artifacts
          if-no-files-found: warn
          path: |
            ${{ steps.synthetic.outputs.run_dir }}
            ${{ steps.formula_full.outputs.run_dir }}
            ${{ steps.formula_gate.outputs.run_dir }}
            ${{ steps.table_anchor_sources.outputs.preflight_dir }}
            ${{ steps.table_anchors.outputs.run_dir }}
            ${{ steps.package_release.outputs.release_dir }}

  create-nightly-failure-issue:
    name: create-nightly-failure-issue
    runs-on: ubuntu-latest
    needs:
      - nightly-full-e2e
    if: ${{ always() && needs.nightly-full-e2e.result == 'failure' }}
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create nightly failure issue
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/create_nightly_failure_issue.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --workflow-name "nightly-full-e2e"