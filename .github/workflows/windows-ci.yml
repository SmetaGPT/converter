name: windows-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build]

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -v

      - name: Run OCR preflight schema check
        shell: pwsh
        run: |
          python -m doc_converter.cli check-ocr | Out-Null
          if ($LASTEXITCODE -notin @(0, 1)) { exit $LASTEXITCODE }

      - name: Run synthetic e2e
        shell: pwsh
        run: |
          python scripts\run_synthetic_e2e.py --clean

      - name: Build Windows package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Name DocumentConverter