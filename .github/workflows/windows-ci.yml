name: windows-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/gitleaks/gitleaks/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -like '*windows_x64.zip' } | Select-Object -First 1
          if (-not $asset) { throw 'Gitleaks Windows asset not found' }
          $zipPath = Join-Path $env:RUNNER_TEMP $asset.name
          $toolDir = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $toolDir -Force
          $binary = Get-ChildItem $toolDir -Recurse | Where-Object { $_.Name -eq 'gitleaks.exe' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $binary) { throw 'Gitleaks binary missing after extraction' }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $binary -Parent)

      - name: Run secret scan
        shell: pwsh
        run: |
          gitleaks git --config .gitleaks.toml --exit-code 1 .

  lint:
    name: lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Run Ruff
        shell: pwsh
        run: |
          python -m ruff check src tests scripts

  typecheck:
    name: typecheck
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Run Pyright
        shell: pwsh
        run: |
          python -m pyright

  unit-tests:
    name: unit-tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -v

  harness-validator:
    name: harness-validator
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Validate harness assets
        shell: pwsh
        run: |
          python scripts\validate_harness_assets.py

  formula-benchmark-gate:
    name: formula-benchmark-gate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Run formula benchmark required gate
        shell: pwsh
        run: |
          python scripts\run_formula_benchmark.py samples\formula-benchmark.ci.manifest.jsonl --thresholds samples\formula-benchmark.ci.thresholds.json --output-root runs\formula-benchmark-ci

  document-package-validator:
    name: document-package-validator
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Run synthetic e2e and validate packages
        shell: pwsh
        run: |
          python scripts\run_synthetic_e2e.py --clean
          $runDir = Get-ChildItem runs\synthetic-e2e-output\runs -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $runDir) { throw 'Synthetic run dir missing' }
          python scripts\validate_run_package.py $runDir
          python scripts\validate_document_package.py $runDir

  release-smoke:
    name: release-smoke
    runs-on: windows-latest
    needs:
      - secret-scan
      - lint
      - typecheck
      - unit-tests
      - harness-validator
      - formula-benchmark-gate
      - document-package-validator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Check dependency graph
        shell: pwsh
        run: |
          python -m pip check

      - name: Run Ruff
        shell: pwsh
        run: |
          python -m ruff check src tests scripts

      - name: Run Pyright
        shell: pwsh
        run: |
          python -m pyright

      - name: Check agent eval schedule plan
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\register-agent-eval-schedule.ps1 -CheckOnly | ConvertFrom-Json | Out-Null

      - name: Run OCR preflight schema check
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ocrJson = python -m doc_converter.cli check-ocr
          $exitCode = $LASTEXITCODE
          $ocrJson | ConvertFrom-Json | Out-Null
          if ($exitCode -notin @(0, 1)) { exit $exitCode }
          exit 0

      - name: Build Windows package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Name DocumentConverter

      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\smoke-test-windows-exe.ps1 -ExePath dist\DocumentConverter\DocumentConverter.exe

      - name: Package portable release
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\package-release.ps1 -Name DocumentConverter -Version 0.3.0 -SkipBuild
          if (-not (Test-Path dist\release\DocumentConverter-0.3.0\DocumentConverter-0.3.0-windows-portable.zip)) { throw "Portable zip missing" }
          if (-not (Test-Path dist\release\DocumentConverter-0.3.0\DocumentConverter-0.3.0-windows-portable.sha256.txt)) { throw "Checksum missing" }
          if (-not (Test-Path dist\release\DocumentConverter-0.3.0\release-notes.md)) { throw "Release notes missing" }

      - name: Upload portable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: document-converter-portable-release
          path: |
            dist/release/DocumentConverter-0.3.0/DocumentConverter-0.3.0-windows-portable.zip
            dist/release/DocumentConverter-0.3.0/DocumentConverter-0.3.0-windows-portable.sha256.txt
            dist/release/DocumentConverter-0.3.0/release-notes.md