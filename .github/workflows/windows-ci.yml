name: windows-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Check dependency graph
        shell: pwsh
        run: |
          python -m pip check

      - name: Run Ruff
        shell: pwsh
        run: |
          python -m ruff check src tests scripts

      - name: Run Pyright
        shell: pwsh
        run: |
          python -m pyright

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -v

      - name: Validate harness assets
        shell: pwsh
        run: |
          python scripts\validate_harness_assets.py

      - name: Check agent eval schedule plan
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\register-agent-eval-schedule.ps1 -CheckOnly | ConvertFrom-Json | Out-Null

      - name: Run OCR preflight schema check
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ocrJson = python -m doc_converter.cli check-ocr
          $exitCode = $LASTEXITCODE
          $ocrJson | ConvertFrom-Json | Out-Null
          if ($exitCode -notin @(0, 1)) { exit $exitCode }
          exit 0

      - name: Run synthetic e2e
        shell: pwsh
        run: |
          python scripts\run_synthetic_e2e.py --clean

      - name: Build Windows package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Name DocumentConverter

      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\smoke-test-windows-exe.ps1 -ExePath dist\DocumentConverter\DocumentConverter.exe

      - name: Package portable release
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\package-release.ps1 -Name DocumentConverter -Version 0.3.0 -SkipBuild
          if (-not (Test-Path dist\release\DocumentConverter-0.3.0\DocumentConverter-0.3.0-windows-portable.zip)) { throw "Portable zip missing" }
          if (-not (Test-Path dist\release\DocumentConverter-0.3.0\DocumentConverter-0.3.0-windows-portable.sha256.txt)) { throw "Checksum missing" }
          if (-not (Test-Path dist\release\DocumentConverter-0.3.0\release-notes.md)) { throw "Release notes missing" }

      - name: Upload portable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: document-converter-portable-release
          path: |
            dist/release/DocumentConverter-0.3.0/DocumentConverter-0.3.0-windows-portable.zip
            dist/release/DocumentConverter-0.3.0/DocumentConverter-0.3.0-windows-portable.sha256.txt
            dist/release/DocumentConverter-0.3.0/release-notes.md