name: windows-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/gitleaks/gitleaks/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -like '*windows_x64.zip' } | Select-Object -First 1
          if (-not $asset) { throw 'Gitleaks Windows asset not found' }
          $zipPath = Join-Path $env:RUNNER_TEMP $asset.name
          $toolDir = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $toolDir -Force
          $binary = Get-ChildItem $toolDir -Recurse | Where-Object { $_.Name -eq 'gitleaks.exe' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $binary) { throw 'Gitleaks binary missing after extraction' }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $binary -Parent)

      - name: Run secret scan
        shell: pwsh
        run: |
          gitleaks git --config .gitleaks.toml --exit-code 1 .

  lint:
    name: lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Run Ruff
        shell: pwsh
        run: |
          python -m ruff check src tests scripts

  typecheck:
    name: typecheck
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Run Pyright
        shell: pwsh
        run: |
          python -m pyright

  unit-tests:
    name: unit-tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -v

  harness-validator:
    name: harness-validator
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Validate harness assets
        shell: pwsh
        run: |
          python scripts\validate_harness_assets.py

  formula-benchmark-gate:
    name: formula-benchmark-gate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build,dev]

      - name: Run formula benchmark required gate
        shell: pwsh
        run: |
          python scripts\run_formula_benchmark.py samples\formula-benchmark.ci.manifest.jsonl --thresholds samples\formula-benchmark.ci.thresholds.json --output-root runs\formula-benchmark-ci
