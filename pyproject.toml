[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-document-converter"
version = "0.3.0"
description = "Local Windows document converter for portable machine-readable outputs."
readme = "docs/document-converter-roadmap.md"
requires-python = ">=3.11"
dependencies = [
	"pypdf>=5.0",
	"python-docx>=1.1",
	"ocrmypdf>=17.4",
	"jsonschema>=4.23",
	"pillow>=11.0",
	"openpyxl>=3.1",
]

[project.optional-dependencies]
build = [
	"pyinstaller>=6.20",
]
dev = [
	"ruff>=0.12.0",
	"pyright>=1.1.400",
	"types-jsonschema>=4.26",
	"types-openpyxl>=3.1",
]

[project.urls]
Repository = "https://github.com/SmetaGPT/converter"

[project.scripts]
document-converter = "doc_converter.cli:main"
document-converter-gui = "doc_converter.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_converter = [
	"py.typed",
	"formulas/known-patterns.v1.json",
]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W"]
# quality.lint-strict: legacy formatting debt is tracked for later formatting-only cleanup;
# S0.1 keeps semantic E/F failures blocking while avoiding broad unrelated reflow.
ignore = ["E501", "W191", "W292"]

[tool.ruff.lint.per-file-ignores]
"scripts/export_formula_gold.py" = ["E402"]
"scripts/run_formula_benchmark.py" = ["E402"]
"scripts/validate_run_package.py" = ["E402"]
"scripts/validate_known_formulas.py" = ["E402"]

[tool.pyright]
include = ["src", "scripts", "tests"]
executionEnvironments = [
	{ root = ".", extraPaths = ["src"] },
]